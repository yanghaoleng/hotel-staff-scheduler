<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f2f3ef" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <script>
      try {
        const savedTheme = localStorage.getItem("plan-theme") || "system";
        const dark = savedTheme === "dark" || (savedTheme === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        const resolvedTheme = dark ? "dark" : "light";
        const themeColor = dark ? "#171a18" : "#f2f3ef";
        document.documentElement.dataset.theme = resolvedTheme;
        document.documentElement.style.backgroundColor = themeColor;
        document.querySelector('meta[name="theme-color"]').content = themeColor;
      } catch {}
    </script>
    <meta name="description" content="酒店员工智能排班与日历协作工具" />
    <title>栖班 · 酒店人员排班</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
